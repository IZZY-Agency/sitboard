# The board's columns in the board's order (internal/contract.Columns), with
# the words the page uses for them; the facts test checks both.
columns:
  - {id: needs_you, label: Needs you}
  - {id: working, label: Working}
  - {id: with_coordinator, label: With coordinator}
  - {id: in_review, label: In review}
  - {id: done, label: Done · 24h}
  - {id: idle, label: Idle}

home:
