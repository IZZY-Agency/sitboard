    text: >-
      A session's name is the one Claude Code records for it or, when it has
      none, its agterm terminal's name. A Codex session's name is the title
      Codex recorded for it, which the model wrote from the conversation (or
      the one you gave it), cleaned and shortened. A session's title is its
      open pull or merge request's title or, with agterm, the short title its
      terminal shows there (for Claude Code, its own summary of the task);
      without either, it is the session's name, its terminal's name or its
      folder's name.
    short: >-
      A session's title is its open pull or merge request's title or, with
      agterm, the short title its terminal shows there (for Claude Code, its
      own summary of the task); without either, the session's name, its
      terminal's name or its folder's name.
