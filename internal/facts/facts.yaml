        v: [jump]
  - id: needs
    body: [needs-you]
    points:
      - k: blocked
        v: [blocked]
      - k: unseen
        v: [unseen]
      - k: stale
        v: [stale]
      - k: the tab
        v: [tap]
      - k: catch-up
        v: [catchup]
  - id: install
