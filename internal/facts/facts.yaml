  - id: notifications
    text: >-
      **Desktop notifications** are off until you turn them on. The browser
      shows them from the page, on this machine, and they never name an agent,
      a project or a task. The switch, and which notifications were already
      shown or skipped (by card, reason and time), are kept in that browser's
      storage for the board's address, as are the page's view settings.
    anchors:
      - file: web/src/data/notify.ts
        has: "SWITCH_KEY = 'sitboard.notify'"
      - file: web/src/data/notify.ts
        has: agents need you

  - id: no-telemetry
    text: >-
      **No telemetry**, no update check, no crash reports.
    brief: There is no account and no telemetry.
    anchors:
      - code: internal/adapters/github.env
      - code: internal/adapters/gitlab.quietEnv

  # ── Run ────────────────────────────────────────────────────────────────────
  - id: flags
    text: >-
      Flags: `--port`, `--no-open`, `--no-github` (run no `gh`),
      `--no-gitlab` (run no `glab`; with both, nothing goes to GitHub or
      GitLab), `--roots` (only agents working under these folders), `--stale-after` (default `20m`), `--state <file>` (use
      this state file instead of the default one), `--no-state` (keep seen
      marks, what Catch-up marked read and groupings in memory only), `--version`,
      `--licenses` (sitboard's licence and the third-party notices).
    anchors:
      - code: cmd/sitboard.parseArgs

  - id: one-board
    text: >-
      One state file has one board: while sitboard runs, a second sitboard
      (0.3.0 or later) on the same state file refuses to start. Give a second
      board its own file with `--state <file>`, or use `--no-state` for a
      throwaway run that saves nothing. The lock is a `<state file>.lock` file
      beside the state file. A running board that can write it keeps its
      process number and machine name there, and a clean stop empties it; one
      that can only read it writes nothing there and leaves what was in it. On
      a folder that does not support locks, sitboard warns and runs without
      the lock.
    keeps: [can only read]
    anchors:
      - code: internal/state.LockFile
      - code: internal/state.Lock
      - code: internal/state.FileLock.Release
      - test: internal/state.TestLockRefusesASecondHolderAndNamesTheFirst
      - test: internal/state.TestLockUnsupportedFolder
      - test: internal/state.TestLockNamesNoOneWhenTheHolderCannotWrite

  # ── Requirements ───────────────────────────────────────────────────────────
  - id: req-agents
    text: >-
      [Claude Code](https://claude.com/claude-code),
      [Codex](https://github.com/openai/codex) or both: sitboard shows their
      sessions.
    anchors:
      - code: internal/adapters/codex.New

  - id: req-gh
    text: >-
      Optional: [`gh`](https://cli.github.com), logged in, for pull request
      state and Leftovers.
    anchors:
      - code: internal/adapters/github.provider.probeNow

  - id: req-glab
    text: >-
      Optional: [`glab`](https://gitlab.com/gitlab-org/cli) (tested with
      1.131.0), logged in with `glab auth login` to each GitLab host,
      gitlab.com included, for GitLab merge requests.
    anchors:
      - value: internal/adapters/gitlab.testedVersions
        is: '[]string{"1.131.0"}'

  - id: req-agterm
    text: >-
      Optional: [agterm](https://github.com/umputun/agterm), for the one-click
      jump to a session's terminal and better card titles.
    anchors:
      - code: internal/core.title

  - id: req-tmux
    text: >-
      Optional: tmux, for the same one-click jump to a session running in a
      tmux pane.
    anchors:
      - test: internal/core.TestJumpTargetPrefersTheTmuxPane

  # ── Not there yet ──────────────────────────────────────────────────────────
  - id: not-yet-removal
    text: "Removing leftovers: sitboard lists them, but removes nothing."
    anchors:
      - code: internal/leftover.Scan

  - id: not-yet-gitlab-leftovers
    text: "GitLab in Leftovers: Leftovers cover GitHub only."
    anchors:
      - code: internal/core.onlyGitHub

  - id: not-yet-gitlab-issues
    text: "GitLab in the Issues panel: it lists GitHub issues only."
    anchors:
      - file: cmd/sitboard/main.go
        has: "if l, ok := gh.(source.IssueLister); ok {"

  - id: not-yet-ce-approval
    text: Approval on GitLab Community Edition, which has no approval fields.
    anchors:
      - file: internal/adapters/gitlab/mr.go
        has: ApprovalUnknown

  - id: not-yet-codex
    text: >-
      In Catch-up: `codex exec` runs. A cost estimate for Codex (Codex keeps
      no price).
    anchors:
      - file: internal/adapters/codex/catchup.go
        has: 'it.meta.Source == "exec"'

  - id: not-yet-codex-apps
    text: Threads of the Codex desktop app and of editor plugins.
    anchors:
      - code: internal/adapters/codex.New

  # ── The website's own places ───────────────────────────────────────────────
  - id: site-tagline
    text: A live board of the coding agents running on your machine.
    of: [what-it-is]

  - id: site-meta-description
    text: >-
      A local board of your Claude Code and Codex agents: who is working, who
      needs you, which pull request is whose. Free and open source, by IZZY
      Agency.
    of: [what-it-is, local-only, codex-sessions, faq-licence]

  - id: site-description
    text: >-
      sitboard (situation board) is a local tool: one command starts a small
      server on 127.0.0.1 and opens a live board of the Claude Code and Codex
      terminal sessions running on your machine, across all your projects. See
      who is working, who needs you, and which pull requests belong to which
      agent. Free and open source (MIT), by IZZY Agency.
    of: [what-it-is, local-only, codex-sessions, faq-licence]

  - id: site-hero-meta
    text: no account, no telemetry
    of: [no-telemetry]

  - id: site-banner-tool
    text: The sitboard tool itself has no telemetry.
    of: [no-telemetry]

  - id: site-privacy-meta
    text: local only, no telemetry
    of: [local-only, no-telemetry]

  # ── llms.txt: what README leaves out ───────────────────────────────────────
  - id: llms-columns
    text: >-
      Every live agent session gets a card (in-process subagents are counted
      on their parent's card), in one of six columns: Needs you, Working, With
      coordinator, In review, Done · 24h, Idle. A blocked agent stays in Needs
      you and a busy one in Working, whatever its pull or merge requests; a
      session whose state is unknown is in Idle. Once the agent has stopped:
      In review while one of its pull or merge requests is open; Done · 24h
      when none is open and the last one closed in the last 24 hours. A
      session that has ended leaves the board.
    keeps: [whatever its pull or merge requests, leaves the board]
    anchors:
      - code: internal/core.column
      - code: internal/core.Board.mayShowLocked
      - value: internal/core.keepEnded
        is: "false"
      - value: internal/core.doneWindow
        is: 24 * time.Hour
      - test: internal/core.TestColumnTable

  - id: llms-title
    text: >-
      Card title: the newest open pull or merge request's title, else (with
      agterm) the terminal's own title when it is more than a folder path,
      else the session's name, else the agterm terminal's name, else the
      folder name.
    anchors:
      - code: internal/core.title
      - code: internal/core.newestOpenPR
      - test: internal/core.TestTitlePrecedence
      - test: internal/core.TestTitleOnlyFromTheNewestOpenPR

  - id: llms-artifacts
    text: >-
      Artifacts: Board cards link the claude.ai artifacts their session, or
      one of its in-process subagents, published, newest first. A rename made
      later elsewhere is not seen, and a deleted artifact stays listed.
    anchors:
      - code: internal/core.cardArtifacts
      - code: internal/adapters/claude.mergeArtifacts
      - test: internal/core.TestCardShowsArtifactsNewestFirst
      - test: internal/adapters/claude.TestSubagentArtifactsMergeIntoTheSession

  - id: llms-effort
    text: >-
      Effort: next to the model, the level of the session's latest reply (for
      Codex, of its latest turn, so it can change before a reply) (low,
      medium, high, xhigh, max, or a short word Codex recorded, such as
      "ultra") or, for Claude Code before its first reply, the level it was
      started with, marked "at launch".
    anchors:
      - code: internal/core.agentEffort
      - code: internal/adapters/codex.tailer.consume
      - test: internal/core.TestCardEffortAndSource

