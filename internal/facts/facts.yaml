        v: [local-only]
      - k: no conversation text
        v: [page-gets]
      - k: GitHub and GitLab
        v: [nothing-leaves, no-traffic-flags]

faq:
  - q: What is sitboard?
    a: [faq-what]
  - q: Who is it for?
    a:
      - say: >-
          People who run several Claude Code or Codex sessions at once, often
          across several projects. It helps most when a coordinator agent
          spawns worker agents and you need to see who works for whom and who
          is waiting for you.
  - q: How does it find my agents? Do I have to set anything up?
    a: [reads-claude, reads-process, codex-reads, reads-tools, {say: "There is nothing to set up, in sitboard or in your agents."}]
  - q: Which agents does it support?
    a: [codex-sessions]
  - q: Does it send my code or conversations anywhere?
    a: [{say: "No."}, local-only, page-gets, no-telemetry, nothing-leaves, sends-github, sends-gitlab, no-traffic-flags]
  - q: What does “Needs you” mean?
    a: [needs-you, stale]
  - q: How does it know which pull request belongs to which agent, and which worker belongs to which coordinator?
    a: [faq-ownership, mr-ownership, faq-coordinator]
  - q: Do I need agterm?
    a: [{say: "No. Without agterm the board works."}, jump, {say: "With agterm, sitboard can also tell which coordinator started which worker."}]
  - q: Which systems does it run on?
    a: [faq-systems]
  - q: How do I install and update it?
    a: [faq-install]
  - q: Is it free? What is the licence?
    a: [faq-licence]
  - q: Can it control or stop agents?
    a: [faq-control]
