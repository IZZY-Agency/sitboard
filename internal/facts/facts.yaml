# What sitboard does, reads, sends and shows: the one list README's
# generated sections and the website's texts are built from.
#
# Each fact is one claim in up to three wordings: text (README, and the
# website's llms.txt), short (the website's privacy page and llms.txt
# privacy) and brief (the home page and the FAQ, `code` only). A missing
# short falls back to text, a missing brief to short. "joins: true"
# continues the previous fact's list item; "sub: true" nests it.
# "keeps:" lists words (an exception, a condition) that every wording of
# the fact, and every wording of a fact that names it in "of:", must say:
# a shorter form cannot drop what the long one qualifies.
#
# Anchors tie a fact to the code it rests on (see anchors.go). `go test
# ./internal/facts` fails when an anchor is gone, when a stated value
# changed, when a page field is named by no fact, or when the code under a
# "code:" anchor changed since the fact was last confirmed. Then reread the
# fact against that code, fix its wording if it is no longer true, and run
# `make facts-confirm FACTS="<id>"`. After editing this file, `make facts`
# rewrites README.md and the website's copy.

facts:
  # ── Intro ──────────────────────────────────────────────────────────────────
  - id: what-it-is
    text: >-
      sitboard is a small command-line tool: it starts a web server on your
      machine and opens the board in your browser. It answers two questions at
      a glance: **who does what**, and **who needs me**.
    anchors:
      - code: cmd/sitboard.listen
      - test: cmd/sitboard.TestPrintsTokenisedLinkExactlyOnceOnStart

  - id: finds-by-itself
    text: >-
      It finds the running sessions by itself: nobody creates tasks in it, and
      the agents need no setup.
    brief: >-
      sitboard reads what Claude Code and Codex already write on your machine.
      Agents do not need to know it exists, and there is nothing to add to
      your projects.
    anchors:
      - code: internal/adapters/claude.pickProcFacts
      - code: internal/adapters/codex.New

  - id: says-unknown
    text: >-
      When it cannot tell something, it says "unknown" instead of guessing.
    anchors:
      - file: web/src/data/about.ts
        has: "return text || 'unknown'"

  # ── What it does ───────────────────────────────────────────────────────────
  - id: card
    text: >-
      **A card per session.** Each card shows the session's name or title, its
      project, status and model (a Claude model in its family's colour: Fable,
      Opus, Sonnet, Haiku; a Codex model without a family colour) with its
      effort level (low to max, or the word Codex recorded, such as "ultra";
      for Claude Code, before the first reply, the level it was started with,
      marked "at launch"), how long it has been in that state, its output
      tokens and, for Claude Code, a cost estimate, when known, the pull
      requests and merge requests it opened with their checks and review, and,
      on the Board, links to the claude.ai artifacts it published. The pull
      request, merge request and issue numbers shown on the Board, in Lanes and
      in Teams link to GitHub or GitLab when sitboard has the repository's
      whole path (a GitLab path longer than 300 characters is left out) and
      the link is the one for that forge, host, path and number (for GitLab,
      on a host sitboard looked merge requests up on); otherwise the number
      shows without a link.
    keeps: [without a link]
    anchors:
      - code: internal/core.prURL
      - file: web/src/data/derive.ts
        has: "gitlabMount(gitlabHosts, it.host)"
      - code: internal/core.pagePath
      - value: internal/core.maxText
        is: "300"
      - test: internal/core.TestLongGitLabPathIsWholeOrAbsent
      - code: internal/core.agentEffort
      - code: internal/core.effortWord
      - file: web/src/data/derive.ts
        has: "MODEL_FAMILIES = ['fable', 'opus', 'sonnet', 'haiku']"
      - file: web/src/components/Card.svelte
        has: "' at launch'"
      - test: internal/core.TestCardEffortAndSource

  - id: gitlab-mrs
    text: >-
      **GitLab merge requests.** A merge request a session created with `glab
      mr create`, or with `git push -o merge_request.create`, shows like a pull
      request: `!12`, with its state, the issues it closes where GitLab gives
      them, and, for an open request, its draft flag, pipeline and approval
      ("approved" or "approval needed"). Catch-up lists it as opened and
      merged. On gitlab.com and self-hosted GitLab, for the hosts your own
      `glab` is logged in to. Once a merge request is on the board, the page
      says "pull or merge request". Off with `--no-gitlab`.
    anchors:
      - code: internal/adapters/gitlab.mapPipeline
      - file: web/src/data/words.ts
        has: approval needed
      - file: web/src/data/derive.ts
        has: "pr.forge === 'gitlab' ? '!' : '#'"
      - test: internal/core.TestGitLabMergeRequestsAreLookedUp
      - test: internal/core.TestGitLabOffAsksNothing

  - id: mr-ownership
    text: >-
      A merge request belongs to the session whose own `glab mr create`
      created it, or whose own `git push -o merge_request.create` did, when
      GitLab's creation time falls within two minutes of that push.
    anchors:
      - value: internal/core.pushSkew
        is: 2 * time.Minute
      - code: internal/core.pushCredited
      - test: internal/core.TestPushCredited

  - id: codex-sessions
    text: >-
      **Codex sessions.** Sessions of the Codex terminal client and of `codex
      exec` get cards like Claude Code's. A Codex session that waits for your
      approval shows as blocked only with agterm. Threads of the Codex desktop
      app and of editor plugins are not shown.
    brief: >-
      Claude Code and Codex: sessions of the Codex terminal client and of
      `codex exec`. Threads of the Codex desktop app and of editor plugins are
      not shown.
    anchors:
      - file: internal/adapters/codex/codex.go
        has: approval waits show only through agterm
      - code: internal/adapters/codex.New

  - id: critter
    text: >-
      **A critter for every agent.** Each agent gets its own small creature,
      drawn from its session id, which helps tell agents apart; its eyes,
      outline and the line under its feet show the state, and the column and
      words still say it. Critters move only while you can see them, and with
      reduced motion they stay still.
    anchors:
      - file: web/src/data/critter.ts
        has: "prng(String(id), 'B')"
      - file: web/src/components/Critter.svelte
        has: prefersReducedMotion.current

  - id: board-view
    text: >-
      **Board** (the default view). One column per state, in this order: Needs
      you, Working, With coordinator, In review, Done · 24h, Idle.
    anchors:
      - code: internal/contract.Columns
      - value: internal/core.doneWindow
        is: 24 * time.Hour
      - test: internal/core.TestColumnTable

  - id: lanes-view
    text: >-
      **Lanes.** One row per project, with a "Needs you" strip on top.
    brief: One row per project, so you can read a project left to right.
    anchors:
      - file: web/src/views/Lanes.svelte
        has: Needs you

  - id: teams-view
    text: >-
      **Teams.** Your queue beside one panel per coordinator with its workers,
      and one panel of solo agents.
    brief: Each coordinator with the workers it spawned.
    anchors:
      - file: web/src/views/Teams.svelte
        has: Your queue

  - id: project-tiles
    text: >-
      **Project tiles or a side rail.** You choose which; they pick the
      projects every view shows. A project that spans several repositories
      shows as one entry with its parts. A grouping you do not want can be
      forgotten once (that folder stays apart until no agent has sat in it for
      two minutes) or set to never group; a grouping you want to keep can be
      set to always group. The status bar lists every folder with a setting, to
      set it back to auto.
    brief: >-
      Every project with a live agent, with repositories inside one folder
      grouped together. From the page, a grouping can be forgotten, or set to
      always or never group.
    anchors:
      - value: internal/core.umbrellaSettle
        is: 2 * time.Minute
      - code: internal/core.Board.noteForgottenLocked
      - test: internal/core.TestForgetLiftsOnceTheFolderIsEmpty
      - file: web/src/data/view.ts
        has: "'tiles' | 'rail'"

  - id: catchup
    text: >-
      **Catch-up.** A panel with the finished turns, pull and merge requests
      opened and merged, and artifacts published in the last 7 days that are
      unread, grouped by project; a list holds at most 1000 of them, and a
      project with more than five shows four and folds the rest under "Show
      N more".
      Pressing "Caught up" marks read the items of the list the panel loaded,
      folded ones included, and nothing else marks an item read: one
      beyond those 1000, one only another tab showed, or one sitboard first
      finds later, even if it happened earlier (such as a session it reads in
      the background), stays unread until a list holds it and it is marked
      read, across restarts too while the state file can be saved. A list
      from before a restart, or one too old after newer lists, marks nothing, and neither does one that would
      keep more than 20,000 items marked read in the last 7 days; the panel
      says so. The first time this version opens a state file of sitboard
      0.4.0 or earlier, it drops that file's catch-up marker, so the items of
      the last 7 days are unread again, up to 1000 in a list; if it cannot
      save the file without the marker, that run keeps what it marks read in
      memory only, and the panel says nothing is saved. Opening the panel
      marks nothing read. It covers the Claude Code and Codex terminal sessions of
      the last 7 days, including those that had ended before sitboard started;
      while those are still being read, the panel says so, and when that read
      was cut short (it has a time budget and leaves out a file larger than
      512 MiB) the panel says items may be missing. Not in it: Claude Code
      sessions whose transcript is gone, `claude -p`, SDK and MCP-server runs,
      and `codex exec` runs.
    brief: >-
      What happened in the last 7 days that you have not caught up on:
      finished turns, pull and merge requests opened and merged, artifacts
      published. It includes sessions that ended before sitboard started;
      `claude -p`, SDK and `codex exec` runs are left out.
    anchors:
      - value: internal/core.catchupWindow
        is: 7 * 24 * time.Hour
      - value: internal/core.maxCatchupItems
        is: "1000"
      - value: internal/state.MaxCatchupRead
        is: "20000"
      - value: internal/adapters/codex.catchupFileCap
        is: 512 << 20
      - file: internal/state/state.go
        has: "legacy := present(disk.Marker) || present(disk.Unread)"
      - file: web/src/components/CatchupPanel.svelte
        has: items from them may be missing here
      - code: internal/core.Board.collectLocked
      - code: internal/core.Board.mayCatchUpLocked
      - code: internal/adapters/claude.interactive
      - code: internal/core.Board.MarkCatchupRead
      - code: internal/core.Board.backfillPendingLocked
      - file: internal/adapters/codex/codex.go
        has: 'Headless:     s.meta.Source == "exec"'
      - file: web/src/components/CatchupPanel.svelte
        has: Still reading the sessions that ended before sitboard started
      - test: internal/core.TestCatchupTurnsFollowTheWindow

  - id: tap
    text: >-
      **A tap on the shoulder.** The tab's title and icon show how many agents
      need you, and the icon a "?" when the board is not live. Turn on Notify
      in the header for a desktop notification when an agent starts needing
      you; for one agent it says why, for several how many, never which agent
      or task, and it stays quiet while the board is in front of you. The
      switch is off until you turn it on, and the choice holds for every tab of
      that board's address in that browser (sitboard on another port asks
      again).
    brief: >-
      Its title and icon show how many agents need you. Turn on Notify for a
      desktop notification when one starts needing you; it never names the
      agent or the task.
    anchors:
      - file: web/src/data/nudge.ts
        has: /badge/lost.svg
      - file: web/src/data/notify.ts
        has: agents need you
      - file: web/src/data/notifier.svelte.ts
        has: w.document.visibilityState === 'visible' && w.document.hasFocus()

  - id: spend
    text: >-
      **Spend.** A Spend button in the header gives today's use and opens a
      panel with each project's use per day for the last 7 days: output tokens
      and, for Claude Code, a cost estimate at API list price, from Claude
      Code's own price table or the total Claude Code recorded, always marked
      "≈" and never a bill. Codex keeps no price, so its sessions show tokens
      only.
    brief: >-
      Each agent's output tokens and, for Claude Code, a cost estimate at API
      list price, from Claude Code's own price table or the total Claude Code
      recorded, marked ≈: an estimate, never a bill. A Spend panel gives each
      project's use per day for 7 days.
    anchors:
      - value: internal/core.spendDays
        is: "7"
      - code: internal/core.Board.spendLocked
      - file: web/src/components/SpendPanel.svelte
        has: Amounts are ≈ at API list price.
      - test: internal/core.TestCodexTokensSitBesideTheMoney

  - id: leftovers
    text: >-
      **Leftovers.** A quiet "N leftovers" link in the status bar lists merged
      work still on the machine that sitboard has evidence for: a worktree,
      branch or branch on GitHub whose pull request merged into the default
      branch, and idle sessions whose own pull requests all merged at least 24
      hours ago. Each item links its merged pull request and says what sitboard
      checked, for example "merged · nothing uncommitted · not in use". Work
      that still holds something (commits after the merge, uncommitted files, a
      stash, a process in the folder) is only counted, except a worktree in use
      only by finished sessions that are themselves listed, shown as "in use by
      its session" (or "by a finished session"). Files git ignores do not hold
      a worktree back: it is listed with a warning that says how many it holds
      (such as `.env` or `node_modules`), unless sitboard could not list every
      checkout of the repositories on the board, as one could hide among them.
      It is a list only. GitHub only; off with `--no-github`.
    brief: >-
      Merged work still on the machine that sitboard has evidence for (a
      worktree, a branch, a branch on GitHub, an idle session) is listed with
      what it checked, such as "merged · nothing uncommitted · not in use". A
      list only, and GitHub only.
    anchors:
      - code: internal/core.sessionLeftover
      - code: internal/leftover.Scan
      - code: internal/core.onlyGitHub
      - file: web/src/data/leftovers.ts
        has: "in use by ${it.ownSession ? 'its session' : 'a finished session'}"
      - file: web/src/components/LeftoversSheet.svelte
        has: git-ignored
      - code: internal/adapters/gitsrc.resolver.TreeStatus
      - test: internal/leftover.TestLabCases
      - test: internal/core.TestLeftoverWorktreeWithItsSession
      - test: internal/core.TestLeftoversOffWithoutGitHub

  - id: issues
    text: >-
      **Issues.** An Issues chip in the header adds up the open issues of the
      GitHub repositories of the projects on the board that GitHub has
      answered for, and shows that number when it is above zero. It opens a
      panel that lists the open issues of the projects you picked, read only,
      grouped by milestone (with a filter when there is more than one group,
      issues with no milestone being a group of their own): each issue's number, linked to GitHub, its title, labels and
      when it was last updated, up to 30 per repository and a link to the
      rest. Project tiles and rail rows show the open counts GitHub has
      given for a project's repositories (rail rows when above zero). GitHub only; off with `--no-github`.
    brief: >-
      The open GitHub issues of your projects' repositories, read only,
      grouped by milestone, with a project's count on its tile once GitHub
      has answered.
    anchors:
      - value: internal/model.MaxRepoIssues
        is: "30"
      - file: web/src/components/IssuesPanel.svelte
        has: aria-label="Milestone, counting the issues listed here"
      - file: web/src/components/IssuesPanel.svelte
        has: "+{more} more on {forgeName(s.repo.forge)} ↗"
      - file: web/src/components/ProjectTiles.svelte
        has: openIssuesText(t.issues)
      - file: web/src/components/ProjectRail.svelte
        has: openIssuesText(p.issues)
      - file: web/src/data/issues.ts
        has: "export function openIssuesOf(projects: readonly Project[]): number | null {"
      - file: cmd/sitboard/main.go
        has: "if l, ok := gh.(source.IssueLister); ok {"

  - id: jump
    text: >-
      **A jump to the terminal.** With [agterm](https://github.com/umputun/agterm),
      one click jumps to the session's terminal, and cards get better titles; a
      Claude Code session in tmux jumps to its tmux pane instead, with or
      without agterm, when a tmux client is attached to that pane's server
      (with none attached, the click says the jump failed and offers to retry).
      A card with no terminal to jump to shows the session's folder and name
      to copy instead.
    brief: >-
      Click a card to focus its session in agterm, if you use it, or a Claude
      Code session's tmux pane, when a tmux client is attached (with none, the
      click says the jump failed and offers to retry). A card with no terminal
      to jump to shows its folder and name, ready to copy.
    anchors:
      - code: internal/core.jumpKind
      - test: internal/core.TestJumpTargetPrefersTheTmuxPane
      - file: internal/server/actions.go
        has: no tmux client is attached
      - file: web/src/data/store.svelte.ts
        has: "kind: 'failed', what: `Jump to"
      - file: web/src/components/ActionNotice.svelte
        has: "Open it yourself: the folder and the session name, to copy."

  # ── Home page and FAQ only ─────────────────────────────────────────────────
  - id: views-switch
    text: >-
      Switch at any time. Cards move between columns as agents change state:
      for Claude Code within about a second while sitboard can watch its
      session folder, otherwise within about ten seconds; within a few seconds
      for Codex; and, while `gh` and `glab` answer, about once a minute for the
      state of a live agent's pull and merge requests. Each agent has its own
      critter, and each Claude model name shows in its family's colour, with
      the session's effort level beside it.
    keeps: [ten seconds, while `gh` and `glab` answer]
    anchors:
      - file: internal/adapters/claude/claude.go
        has: "tick: 3 * time.Second, liveTick: 10 * time.Second"
      - file: web/src/data/derive.ts
        has: MODEL_FAMILIES
      - file: web/src/components/ViewSwitcher.svelte
        has: "label: 'Teams'"
      - test: internal/adapters/claude.TestStatusChangeEmitsWithinOneSecond
      - file: internal/adapters/codex/codex.go
        has: "tick: 2 * time.Second, liveTick: 4 * time.Second"
      - value: internal/core.githubEvery
        is: time.Minute
      - value: internal/core.hostEvery
        is: time.Minute

  - id: pull-requests-linked
    text: >-
      Linked to the agent that opened them, with check status, through your own
      gh; GitLab merge requests (`!12`) the same way, through your own glab.
      Their numbers, and those of the issues they close, link to GitHub or
      GitLab when sitboard has the repository's whole path and the address
      checks out against it; otherwise the number shows without a link.
    keeps: [without a link]
    anchors:
      - code: internal/core.Board.linkedPRsLocked
      - code: internal/core.pagePR
      - code: internal/core.prURL
      - file: web/src/data/derive.ts
        has: "gitlabMount(gitlabHosts, it.host)"
      - code: internal/core.pagePath
      - test: internal/core.TestLongGitLabPathIsWholeOrAbsent

  - id: artifacts-linked
    text: >-
      The claude.ai artifacts an agent published, linked from its card on the
      Board.
    anchors:
      - code: internal/core.cardArtifacts

  - id: needs-you
    text: >-
      An agent blocked on a question or a permission goes to the first column.
      So does an agent with no coordinator that finished a turn you have not
      seen, until you look, unless one of its pull or merge requests is open
      (it goes to In review) or the last one closed in the last 24 hours (Done).
      A worker's finished turn goes to With coordinator, with the same two
      exceptions. The needs-you queue in Lanes and Teams also lists stale cards
      and failing checks.
    keeps: [In review]
    anchors:
      - code: internal/core.column
      - test: internal/core.TestColumnTable
      - file: web/src/views/Lanes.svelte
        has: Needs you

  - id: blocked
    text: Waiting for an answer or a permission, whatever its pull or merge requests.
    anchors:
      - code: internal/core.column
      - test: internal/core.TestColumnTable

  - id: unseen
    text: >-
      Finished a turn you have not seen, with no coordinator to report to and
      no pull or merge request open or closed in the last 24 hours. A worker's
      finished turn goes to With coordinator, unless one of its pull or merge
      requests is open (In review) or the last one closed in the last 24 hours
      (Done).
    of: [needs-you]

  - id: stale
    text: >-
      Not a column: a flag on a busy card that has been silent for longer than
      `--stale-after` (20 minutes by default).
    anchors:
      - test: internal/core.TestStaleThresholdIsConfigurable
      - file: cmd/sitboard/main.go
        has: 20*time.Minute

  - id: reaches-out
    text: >-
      It runs on your machine, and talks to GitHub and GitLab through your own
      gh and glab.
    of: [sends-github, sends-gitlab]

  - id: board-local
    text: >-
      The board is a small server on 127.0.0.1, behind a private link it
      prints when it starts. There is no account and no telemetry.
    of: [local-only, private-link, no-telemetry]

  - id: hero
    text: >-
      sitboard (situation board) is one command. It finds the Claude Code and
      Codex terminal sessions already running on your machine, in every project,
      and shows who is working, who is waiting for you, and which pull or merge
      request came from which agent. Nothing to set up, and nothing leaves your
      machine but what your own gh and glab ask GitHub and GitLab, and what it
      reads and writes in files you keep on a network folder. With --no-github
      and --no-gitlab it runs no gh and no glab.
    of: [what-it-is, codex-sessions, nothing-leaves, no-traffic-flags]

  - id: faq-what
    text: >-
      sitboard is a local tool that shows the coding agents running on your
      machine on one live board. Run `sitboard` and it starts a small server on
      127.0.0.1 and opens the board in your browser: who is working, who needs
      you, and which pull requests belong to which agent.
    of: [what-it-is, local-only]

  - id: faq-ownership
    text: >-
      A pull request belongs to the session whose own `gh pr create` created
      it, as recorded in that session's transcript or Codex session file; one
      that `gh` reports as already existing does not count.
    anchors:
      - code: internal/core.Board.linkedPRsLocked

  - id: faq-coordinator
    text: >-
      A worker belongs to the coordinator whose own `agtermctl session new`
      started it, so that link needs agterm. When sitboard cannot tell, the
      card says unknown instead of guessing.
    anchors:
      - file: web/src/data/about.ts
        has: "return text || 'unknown'"

  - id: faq-systems
    text: >-
      macOS first. Linux builds exist, but we have not tested them yet. There
      is no Windows build.
    anchors:
      - file: scripts/release.sh
        has: linux

  - id: faq-install
    text: >-
      With Homebrew: `brew install izzy-agency/tap/sitboard`, and `brew
      upgrade sitboard` to update. From source, with Go 1.27 and Node 22: clone
      the repository and run `make build`, which writes one binary with the
      page built in.
    anchors:
      - file: Makefile
        has: "build: web-build go-build"

  - id: faq-licence
    text: >-
      Yes, it is free and open source under the MIT licence, made by IZZY
      Agency. There is no account to create. `sitboard --licenses` prints its
      licence and the notices of the third-party components in its binary.
    anchors:
      - file: cmd/sitboard/main.go
        has: '"licenses"'

  - id: faq-control
    text: >-
      No. sitboard only shows agents. Its actions are focusing a session in
      agterm or its tmux pane (or showing its details to copy), marking a card
      as seen, marking the catch-up read, turning notifications on or off, and
      forgetting or setting a project grouping; it never types into, stops or
      changes a session, and it lists leftovers but removes nothing.
    anchors:
      - file: internal/server/actions.go
        has: StatusNoContent

  - id: install-homebrew
    text: >-
      macOS and Linux. Signed and notarized on macOS; we have not tested the
      Linux builds yet.
    anchors:
      - file: scripts/notarize.sh
        has: notarytool

  - id: install-source
    text: Go 1.27 and Node 22. One binary, the page is built in.
    anchors:
      - file: go.mod
        has: go 1.27

  - id: install-needs
    text: >-
      Needs Claude Code or Codex. agterm is optional and adds the one-click
      jump and better card titles; a Claude Code session in tmux jumps to its
      pane when a tmux client is attached. glab, logged in, adds GitLab merge
      requests. Not there yet: leftovers on GitLab, and removing leftovers.
    of: [jump, gitlab-mrs, not-yet-gitlab-leftovers, not-yet-removal]

  # ── Privacy ────────────────────────────────────────────────────────────────
  - id: runs-while
    text: >-
      sitboard runs on your machine and only while you run it. What it does
      with data, in short:
    anchors:
      - code: cmd/sitboard.listen

  - id: local-only
    text: >-
      **Local only.** sitboard listens on `127.0.0.1`, never on your network.
    short: >-
      **Local only.** It listens on `127.0.0.1` and nothing else.
    brief: >-
      The board is a server on 127.0.0.1 that refuses requests from other
      sites and hosts.
    anchors:
      - code: cmd/sitboard.listen
      - test: cmd/sitboard.TestListensOnLoopbackOnly
      - test: internal/server.TestRejectsForeignOrigin

  - id: private-link
    text: >-
      **A private link for this run.** It prints a link that carries a secret,
      new each time sitboard starts; your browser swaps it for a cookie.
      Requests without it, and requests from other websites, are refused.
    short: >-
      **A private link per run.** The board opens on a link with a random
      token that is new each time sitboard starts and dies when it stops.
    anchors:
      - code: cmd/sitboard.newToken
      - code: internal/server.secure
      - test: internal/server.TestNoTokenIs401
      - test: internal/server.TestCrossSiteFetchIsRefused

  - id: nothing-leaves
    text: >-
      **Nothing leaves your machine**, except what your own `gh` and `glab`
      commands send (and what sitboard reads and writes in files you keep on a
      network folder, such as a `--state` file there):
    short: >-
      **Nothing leaves your machine**, except what your own `gh` and `glab`
      commands send, which you can switch off (and what it reads and writes in
      files you keep on a network folder, such as a `--state` file there):
    brief: >-
      Nothing leaves your machine but what your own `gh` sends to GitHub, what
      your own `glab` sends to a GitLab host your sessions use, and what
      sitboard reads and writes in files you keep on a network folder.
    keeps: [network folder]
    anchors:
