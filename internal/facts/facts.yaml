        v: [lanes-view]
      - k: Teams
        v: [teams-view]
  - id: found
    body: [finds-by-itself, reads-process]
    points:
      - k: projects
        v: [project-tiles]
      - k: pull requests
        v: [pull-requests-linked]
      - k: spend
        v: [spend]
      - k: leftovers
        v: [leftovers]
      - k: issues
        v: [issues]
      - k: artifacts
        v: [artifacts-linked]
