  - id: page-free-text
    joins: true
    text: >-
      The only free text the page gets from a transcript is an artifact's
      title (the title its own publish reported) and, when the session's own
      record has no name (as for a session that has ended), the name Claude
      Code recorded for it in the transcript (yours, or one it made itself, for
      example from a plan), both cleaned and shortened.
    short: >-
      The only free text the page gets from a transcript is the title of an
      artifact a session published, as its own publish reported it, and, when
      the session's own record has no name (as for a session that has ended),
      the name Claude Code recorded for it in the transcript (yours, or one it
      made itself, for example from a plan), both cleaned and shortened.
    anchors:
      - test: internal/adapters/claude.TestNoTranscriptTextInEmittedFacts
      - code: internal/core.cardArtifacts

  - id: page-hosts
    joins: true
    text: >-
      The GitLab hostnames of your projects' origins and of the merge
      requests, and the host named in the GitLab status line, appear on the
      page. So does the list of the GitLab hosts the page may link to: each
      with its web port, if the address has one, and the subfolder glab has
      for it (as in `example.com:8443/gitlab`), which the page's link check
      requires the project's address to start with.
    anchors:
      - field: Project.repoHost
      - field: PullRequest.host
      - field: Issue.host
      - field: Snapshot.gitlabHosts
      - field: SourceStatus.detail

  - id: page-codex
    joins: true
    text: >-
      From a Codex rollout the page gets only derived fields (model, effort,
      folder, pull requests, finished turns' times, token counts), no text from the conversation; the
      only free text from Codex's files is the session's title.
    short: >-
      From a Codex rollout the page gets only derived fields (model, effort,
      folder, pull requests, finished turns' times, token counts); the only free text from Codex's
      files is a session's title, which Codex recorded for it.
    anchors:
      - code: internal/adapters/codex.names.update
      - code: internal/adapters/codex.tailer.consume
      - test: internal/adapters/codex.TestNoRolloutTextInEmittedFacts

  - id: page-issues
    joins: true
    text: >-
      For the Issues panel, the page gets the open issues of the repositories
      of the projects on the board, read only: for each repository its open
      count and up to 30 issues with their number, title, link, milestone and
      its due date, up to 5 labels and when each was last updated, plus each
      project's open count. A title, a milestone and a label hold whatever
      words they were given on the forge; sitboard cleans them and shortens
      long ones before serving them. They are
      kept in memory only, never written anywhere. When an issue look finds
      the GitHub login gone, they leave the page.
    short: >-
      For the Issues panel, the page gets the open issues of your projects'
      repositories, read only: up to 30 per repository with their number,
      title, link, milestone, labels and when each was last updated. A title
      holds whatever words it was given, cleaned and shortened; they are kept
      in memory only, and they leave the page when an issue look finds the
      GitHub login gone.
    brief: >-
      The Issues panel lists the open issues of your projects' repositories,
      read only, kept in memory only.
    anchors:
      - value: internal/model.MaxRepoIssues
        is: "30"
      - value: internal/model.MaxIssueLabels
        is: "5"
      - code: internal/core.pageRepoIssues
      - test: internal/core.TestALostLoginShowsOnTheGitHubLineUntilALookAnswersAgain
      - field: Snapshot.issues
      - field: Project.openIssues
      - field: IssueCount.known
      - field: IssueCount.open
      - field: IssuesSummary.state
      - field: IssuesSummary.asOf
      - field: IssuesSummary.open
      - field: IssuesSummary.rev
      - field: IssuesSummary.purged
      - field: Issues.state
      - field: Issues.asOf
      - field: Issues.repos
      - field: Issues.rev
      - field: Issues.freshMs
