  - id: sends-github
    sub: true
    text: >-
      to GitHub, a check that `gh` is logged in, and read-only lookups for pull
      request state and, for the Issues panel, for the open issues of the
      repositories of the projects on the board (their owner and name, at most
      20 to a call and 100 to a look). The first look runs once sitboard
      knows a repository to ask about, then about every ten minutes; a
      repository new to the board or the panel reading the list can start
      one sooner, never within a minute of the latest one's start nor while
      one is under way. Once GitHub's rate limit stops a look, issue lookups,
      and pull request and Leftovers lookups for the repositories that look
      asked about, wait five minutes; one that had already passed that check
      can still send its request. For Leftovers, these lookups include up to 100 branch
      names from each clone on the board: its local branches (never-pushed
      ones included) first, then its origin branches. `gh` runs with your
      environment and handles its own login: sitboard never asks for a GitHub
      token, and keeps, logs and serves none (a token in the environment of an
      agent's process it reads, below, is read past with the rest).
    short: >-
      to GitHub, `gh` sends a check that it is logged in and read-only lookups
      for pull request state and for the open issues of your projects'
      repositories; for leftovers, these lookups include up to 100
      branch names from each clone on the board, local ones (never-pushed ones
      included) first, then origin ones. `gh` runs with your environment and
      handles its own login: sitboard never asks for a GitHub token, and
      keeps, logs and serves none.
    brief: >-
      `gh` sends a check that it is logged in and read-only lookups (pull
      requests, open issues), which for leftovers include branch names.
    anchors:
      - code: internal/adapters/github.provider.probeNow
      - code: internal/adapters/github.provider.Evidence
      - code: internal/adapters/github.provider.OpenIssues
      - value: internal/adapters/github.issueReposPerCall
        is: "20"
      - value: internal/core.issuesEvery
        is: "10 * time.Minute"
      - value: internal/core.maxIssueRepos
        is: "100"
      - value: internal/contract.IssuesFreshFor
        is: "time.Minute"
      - value: internal/adapters/github.rateLimitBackoff
        is: "5 * time.Minute"
      - code: internal/core.Board.issuesDueLocked
      - code: internal/leftover.Names
      - value: internal/leftover.MaxNames
        is: "100"
      - code: internal/adapters/github.env
      - file: internal/adapters/internal/proc/argsenv_linux.go
        has: "defer func() { clear(environ); clear(cmdline) }()"
      - test: internal/leftover.TestNames

  - id: sends-gitlab
    sub: true
    text: >-
      to GitLab, through `glab`'s own login, and only about a GitLab host that
      a session inside `--roots` points to (the host of a merge request it
      created or a push of its named, or of its folder's origin when that is
      not on github.com): `glab auth status`, glab's own login check, which
      contacts the host when glab has a login stored for it; and read-only
      lookups for merge request state, only to a host whose login check passed
      within the last ten minutes (gitlab.com included), which send the
      project's path or numeric id and the numbers of the merge requests a
      session created or a push of its named, and ask which issues such a
      merge request closes. No branch name goes to GitLab. glab is asked
      about a host by its name without a port, so it goes where its own
      configuration for that name points.
    short: >-
      to GitLab, `glab` talks only about a GitLab host that a session inside
      `--roots` points to (the host of a merge request it created or a push of
      its named, or of its folder's origin when that is not on github.com):
      `glab auth status`, glab's own login check, contacts the host when glab
      has a login stored for it; lookups go only to a host whose login check
      passed within the last ten minutes (gitlab.com included) and send the
      project's path or numeric id and the numbers of the merge requests a
      session created or a push of its named, and ask which issues such a
      merge request closes. No branch name goes to GitLab.
    brief: >-
      `glab` sends its own login check, which contacts the host when glab has
      a login stored for it, and, once that check has passed, read-only
      lookups with a project's path or id and merge request numbers.
    anchors:
      - code: internal/core.Board.gitlabDemandLocked
      - code: internal/core.Board.lookupsLocked
      - code: internal/core.Board.refreshForges
      - code: internal/adapters/gitlab.Provider.host
      - code: internal/adapters/gitlab.Provider.Lookup
      - code: internal/adapters/gitlab.closesIssuesPath
      - value: internal/adapters/gitlab.knownFor
        is: 10 * time.Minute
      - test: internal/core.TestOutsideRootsAsksNoGitLabHost
      - test: internal/adapters/gitlab.TestLookupAsksOnlyKnownHosts

  - id: no-traffic-flags
    text: >-
      **`--no-github` and `--no-gitlab` together stop all traffic to GitHub
      and GitLab.** With both, sitboard runs no `gh` and no `glab`, and it
      opens no network connection of its own. Two things stay: the board's own
      server on `127.0.0.1`, which only your machine can reach, and the files
      it reads and writes, which go over the network only when you keep them
      on a network folder (such as a `--state` file there). With `--no-github`
      alone, `glab` can still contact the GitLab hosts your sessions use.
    short: >-
      With `--no-github` alone, `glab` can still contact the GitLab hosts your
      sessions use. **`--no-github` and `--no-gitlab` together stop all
      traffic to GitHub and GitLab**: with both, it runs no `gh` and no
      `glab` and opens no network connection of its own; the board's server
      on `127.0.0.1` stays, and so do its files, which go over the network
      only on a network folder.
    brief: >-
      With `--no-github` alone, `glab` can still contact the GitLab hosts your
      sessions use. With both `--no-github` and `--no-gitlab`, sitboard runs
      no `gh` and no `glab` and opens no network connection of its own; its
      files go over the network only if you keep them on a network folder.
    keeps: [no `gh` and no `glab`, network folder]
    anchors:
      - code: internal/core.Board.gitlabOffLocked
      - code: internal/core.Board.githubOffLocked
      - code: internal/adapters/gitlab.Provider.Probe
      - code: cmd/sitboard.listen
      - test: cmd/sitboard.TestNoGithubFlagTurnsProviderOff
      - test: internal/core.TestGitLabOffAsksNothing

  - id: glab-runs
    text: >-
      **glab.** sitboard runs your own `glab` (found on your `PATH` or in the
      usual install folders); with glab not installed it runs none. `glab
      version` runs when sitboard starts (and each minute while it fails);
      while a session needs a host that is not github.com, `glab auth status`
      runs for it about once a minute until the check passes, then about every
      eight minutes. For a host glab is logged in to, sitboard also runs `glab
      config get --host <host> subfolder`, which reads glab's own config.
    short: >-
      **glab.** sitboard runs your own `glab`; with glab not installed it runs
      none. `glab version` runs when sitboard starts (and each minute while it
      fails); while a session needs a host that is not github.com, `glab auth
      status` runs for it about once a minute until the check passes, then
      about every eight minutes.
    anchors:
      - code: internal/adapters/gitlab.findGlab
      - code: internal/adapters/gitlab.Provider.probeNow
      - code: internal/core.Board.StartGitLabProbe
      - value: internal/core.hostEvery
        is: time.Minute
      - value: internal/adapters/gitlab.unknownFor
        is: time.Minute
      - value: internal/adapters/gitlab.renewAfter
        is: 8 * time.Minute
      - test: internal/adapters/gitlab.TestFindGlab

  - id: glab-env
    joins: true
    text: >-
      glab runs in `/` with an environment sitboard builds, not your shell's:
      `PATH=/usr/bin:/bin`, `HOME`, `USER` and `LOGNAME` from the system's
      user list, the keyring's `DBUS_SESSION_BUS_ADDRESS` and
      `XDG_RUNTIME_DIR`, the proxy variables `HTTP_PROXY`, `HTTPS_PROXY` and
      `NO_PROXY` (and their lowercase forms; `ALL_PROXY` is not passed), so a
      proxy you set sees which hosts glab talks to, and settings that turn off
      glab's telemetry, update checks, prompts, debug output and helper
      downloads. No token, host or config folder from your environment
      reaches glab. sitboard never reads glab's config file itself, and keeps,
      logs and serves no token; glab's output is read for its answer and
      never logged.
    short: >-
      glab runs with an environment sitboard builds, not your shell's: no
      token, host or config folder from your environment; your proxy variables
      (`HTTP_PROXY`, `HTTPS_PROXY`, `NO_PROXY` and their lowercase forms; not
      `ALL_PROXY`) are passed, so a proxy you set sees which hosts glab talks
      to; telemetry and update checks are off. sitboard never reads glab's
      config file itself, keeps no token and never logs glab's output.
    anchors:
      - code: internal/adapters/gitlab.glabEnv
      - value: internal/adapters/gitlab.glabPath
        is: '"/usr/bin:/bin"'
      - value: internal/adapters/gitlab.glabDir
        is: '"/"'
      - code: internal/adapters/gitlab.proxyEnv
      - code: internal/adapters/gitlab.passEnv
      - code: internal/adapters/gitlab.quietEnv
      - value: internal/adapters/gitlab.passProxy
        is: "true"
      - test: internal/adapters/gitlab.TestEnvIsBuiltNotInherited
      - test: internal/adapters/gitlab.TestAccountFromUserListOnly

  - id: reads-claude
    text: >-
      **What it reads.** Claude Code's session files, the transcripts of
      running sessions and, at start, those changed in the last 8 days,
      including ended sessions, to derive states, times, models, effort levels,
      token counts, Claude Code's own cost estimates, pull requests, artifacts
      and names. It keeps only those derived facts, in memory. From
      `~/.claude.json` it reads only Claude Code's price table
      (`additionalModelCostsCache`); every other key in that file is read past
      and not kept.
    short: >-
      **What it reads.** Claude Code's session files, the transcripts of
      running sessions and, at start, those changed in the last 8 days, to
      derive states, times, models, effort levels, token counts, cost
      estimates, pull requests, artifacts and names; it keeps only those
      derived facts, in memory. From `~/.claude.json` it reads only Claude
      Code's price table; every other key in that file is read past and not
      kept.
    brief: >-
      It reads what Claude Code already writes on your machine: a small file
      for each live session, and the transcripts of running sessions and, at
      start, of those changed in the last 8 days, for the pull requests they
      opened, the artifacts they published, the workers they started, their
      effort level and their token use.
    anchors:
      - value: internal/adapters/claude.spendKeep
        is: 8 * 24 * time.Hour
      - code: internal/adapters/claude.readPrices
      - test: internal/adapters/claude.TestNoTranscriptTextInEmittedFacts

  - id: reads-process
    joins: true
    text: >-
      When it first sees a session in a running `claude` process, it reads the
      process's arguments and environment (on macOS through the kernel's
      `kern.procargs2` query, on Linux from `/proc/<pid>/cmdline` and
      `/proc/<pid>/environ`) and keeps four facts: the agterm session id from
      `AGTERM_SESSION_ID`, the tmux pane and its server's socket path from
      `TMUX_PANE` and `TMUX`, the effort level the session was started with,
      from the `--effort` flag or `CLAUDE_CODE_EFFORT_LEVEL`, as one of the
      five level words, and whether it was started with `-p` or `--print`, as
      a yes or no. Every other argument and variable is read past and not
      kept, logged or served.
    short: >-
      When it first sees a session in a running `claude` process, it reads the
      process's arguments and environment (on macOS from the kernel, on Linux
      from `/proc`) and keeps four facts: the agterm
      session id, the tmux pane and its server's socket path, the effort level
      the session was started with (from Claude Code's effort flag or
      `CLAUDE_CODE_EFFORT_LEVEL`), and whether it was started with Claude
      Code's print flag (`-p`). Every other argument and variable is read past
      and not kept, logged or served.
    brief: >-
      From each running Claude Code session's process it keeps four facts: its
      agterm session id, its tmux pane, the effort level it was started with
      and whether it was started with `-p`.
    anchors:
      - code: internal/adapters/claude.pickProcFacts
      - code: internal/adapters/claude.pickTmux
      - code: internal/adapters/claude.launchEffort
      - code: internal/adapters/claude.printFlag
      - value: internal/adapters/claude.agtermVar
        is: '"AGTERM_SESSION_ID"'
      - value: internal/adapters/claude.effortVar
        is: '"CLAUDE_CODE_EFFORT_LEVEL"'
      - test: internal/adapters/claude.TestProcFactsKeepOnlyTheLevel

  - id: reads-tools
    joins: true
    text: >-
      It also asks `git` about each session's folder (repository, branch and
      remote) and, for Leftovers, about the worktrees, local and origin
      branches and stashes of the repositories on the board and the local
      status of the worktrees that could be leftovers and of a main checkout
      where an idle session sits (read only: no fetch, no lock), every 10
      minutes, or sooner when the board sees a merge or a listed session
      changes (at most once a minute); `ps` for when the `claude` and `codex`
      processes started; `lsof` (on Linux `/proc`) for each of your processes'
      parent and working folder, kept in memory for that look only; and, with
      agterm, `agtermctl` for its windows, workspaces, sessions and their
      events. Stash messages, file names from `git status`, which process
      works where and commit ids stay in memory: they are not served, written
      to disk or logged.
    short: >-
      It also asks `git` about each session's folder (repository, branch and
      remote) and, for leftovers, every 10 minutes or sooner, about the
      worktrees, branches and stashes of the repositories on the board and the
      local status of the worktrees that could be leftovers and of a main
      checkout where an idle session sits (read only: no fetch, no lock); `ps`
      for when the `claude` and `codex` processes started; `lsof` (on Linux
      `/proc`) for each of your processes' parent and working folder, kept for
      that look only; and,
      with agterm, `agtermctl` for its windows, workspaces, sessions and their
      events. Stash messages, file names from `git status`, which process
      works where and commit ids stay in memory: they are not served, written
      to disk or logged.
    brief: It asks git for each project's repository and branch.
    anchors:
      - code: internal/adapters/gitsrc.gitVars
      - value: internal/core.leftoversEvery
        is: 10 * time.Minute
      - value: internal/core.leftoversSoonest
        is: time.Minute
      - code: internal/adapters/internal/proc.PSStarts
      - code: internal/adapters/procs.lister.lsof
      - code: internal/adapters/procs.lister.Procs

  - id: tmux-reads
    text: >-
      **tmux.** For a Claude Code session in tmux, sitboard asks `ps` for the
      terminal of the session's process, and asks `tmux` once, on that pane's
      own socket and never starting a server, whether the pane shows that
      terminal; only then does the card offer the tmux jump. Before talking to
      a tmux socket it checks that the socket is yours, in a folder of yours
      that nobody else can write to (a socket directly in a shared folder such
      as `/tmp` gets no tmux jump), and it runs `tmux` by the absolute path it
      found at start (in a folder owned by you or root that nobody else can
      write to), giving it nothing from its environment but `PATH`. It keeps
      the pane's terminal and the session process's id and start time in
      memory, never on disk, to check them again when you click. When you
      jump, it asks `tmux` for that server's panes and clients, and reads the
      arguments and environment of the tmux client it is about to move,
      keeping only its agterm session id (none when that client itself runs in
      tmux). The pane and the socket never reach the page.
    short: >-
      **tmux.** For a Claude Code session in tmux, it asks `tmux` once, on that
      pane's own socket and never starting a server, whether the pane shows the
      session's terminal; only then does the card offer the tmux jump. It talks
      only to a socket that is yours, in a folder of yours that nobody else can
      write to, and runs `tmux` from a folder owned by you or root, with
      nothing from its environment but `PATH`. When you jump, it reads the
      arguments and environment of the tmux client it is about to move and
      keeps only its agterm session id. The pane and the socket stay in memory
      and never reach the page.
    anchors:
      - code: internal/adapters/claude.adapter.ownPane
      - code: internal/adapters/tmux.Adapter.tmux
      - code: internal/adapters/tmux.safeSocket
      - code: internal/adapters/tmux.lookBin
      - code: internal/adapters/tmux.Adapter.raise
      - test: internal/adapters/tmux.TestSafeSocketRefusesWhatIsNotTheUsersSocket
      - test: internal/adapters/tmux.TestTmuxGetsOnlyPATH

  - id: codex-reads
    text: >-
      **Codex.** If Codex's folder exists (`~/.codex`, or `$CODEX_HOME`),
      sitboard reads the rollout files under its `sessions` folder: the first
      line of the recent ones (by modification time) and of those whose lock
      is held, to tell which kind of session it is; the rollouts of running and
      recently active sessions, for states, times, models, effort levels, pull
      requests, the sessions they started and token counts; and, at start,
      those of the last 7 days, including sessions that had already ended, for
      their folder, model and effort, finished turns, pull and merge requests
      and token counts. It reads Codex's session index for each
      session's title, and lists the names of Codex's lock files: it asks
      `lsof` (on Linux `/proc/<pid>/fd`) which process has a session's lock
      file open, without taking the lock. To find the Codex terminal clients
      it asks `ps` for the command lines of all your processes and looks only
      at those of `codex` itself, keeping from each a few facts about the
      process (its id, user and start time, what kind of Codex client it is,
      and a folder given with `--cd`); the others are read past. Of a client it
      confirms as Codex's terminal client it reads the environment, keeping
      only the agterm session id and whether `CODEX_HOME` is the folder it
      watches, and asks for its working folder when the command line does not
      give it; it drops what it read when it cannot confirm the process is
      still the same one. It never opens Codex's databases, and reading Codex
      writes nothing in Codex's folder. It keeps only the derived facts, in memory; Codex's prompts,
      replies and tool output are never kept or shown.
    short: >-
      **Codex.** If Codex's folder exists, it reads the first line of Codex's
      recent session files (by modification time) and of those whose lock is
      held, the files of running and recently active sessions, for states,
      times, models, effort levels, pull requests and token counts, and, at
      start, those of the last 7 days, including sessions that had already
      ended, for their folder, model and effort, finished turns, pull and
      merge requests and token counts; Codex's session index for each
      session's title; and which process holds a session's lock file, without
      taking the lock. It finds the Codex terminal clients among the command
      lines of your processes, keeping only those of `codex`; from a terminal
      client's environment it keeps only the agterm session id and whether
      `CODEX_HOME` is the folder it watches, and it asks for its working
      folder when the command line does not give it. It never opens Codex's
      databases, and reading Codex writes nothing in Codex's folder. Codex's
      prompts, replies and tool output are never kept or shown.
    brief: >-
      For Codex it reads Codex's own session files and session index, and
      finds its terminal clients among your processes' command lines.
    anchors:
      - code: internal/adapters/codex.New
      - value: internal/adapters/codex.turnWindow
        is: 7 * 24 * time.Hour
      - code: internal/adapters/codex.lsofHolders
      - code: internal/adapters/codex.readEnvInfo
      - code: internal/adapters/codex.psList
      - test: internal/adapters/codex.TestNewUsesCodexHome
      - test: internal/adapters/codex.TestHeldLockFindsARolloutOutsideTheWindow

  - id: writes
    text: >-
      **What it writes.** Its own state file, saved through a temporary file
      beside it, and that file's lock file (creating their folder if needed);
      at start, to check that the folder can be written, it also creates an
      empty temporary file there and removes it. The state file
      (`~/Library/Application Support/sitboard/state.json` on macOS; on Linux
      `$XDG_STATE_HOME/sitboard/state.json`, by default
      `~/.local/state/sitboard/state.json`; or the file given with `--state`)
      keeps which cards you have seen, the folders that group projects, the
      groupings you forgot, the folders you set to always or never group, when
      the newest list you marked read with "Caught up" was made, and, for each
      catch-up item marked read whose own time is in the last 7 days, a hash
      of the item's identity (not the identity itself) and that time; an item
      older than 7 days is dropped on the next save. A file of sitboard 0.4.0
      or earlier loses its catch-up marker and the items it kept as unread
      the first time this version opens it. While it holds items marked read,
      the file is written as version 3, which sitboard 0.4.0 and earlier
      refuse to open; the first save after the last of them is 7 days old
      writes it as an older version again. A
      running board that can write the lock file writes its process number and
      machine name there, and a clean stop empties it; when it can only read
      the lock file, it writes nothing there and leaves what was in it. With
      `--no-state` it writes none of these. These are sitboard's own writes:
      the `gh` and `glab` it runs keep their own files as they always do.
    short: >-
      **Two small files of its own**: `state.json` (saved through a temporary
      file beside it), which keeps which cards you have seen, which folders
      group projects, which groupings you forgot, which folders you set to
      always or never group, when the newest list you marked read with "Caught
      up" was made, and, for each catch-up item marked read whose own time is
      in the last 7 days, a hash of the item's identity (not the identity
      itself) and that time; and beside it `state.json.lock`, which
      keeps one board per state file: a running sitboard that can write it
      writes only its process number and machine name there, and a clean stop
      empties it; one that can only read it writes nothing there and leaves
      what was in it. Both are kept in your user folder
      (`~/Library/Application Support/sitboard/` on macOS,
      `~/.local/state/sitboard/` on Linux unless `$XDG_STATE_HOME` says
      otherwise), unless you give sitboard another file with `--state`, which
      puts the lock file beside that one. At start it checks that folder can
      be written with an empty temporary file it removes. With `--no-state` it
      writes none of these. The `gh` and `glab` it runs keep their own files.
    keeps: [can only read]
    anchors:
      - code: internal/state.document
      - code: internal/state.CatchupKey
      - code: internal/state.writeAtomic
      - code: internal/state.CheckWritable
      - code: internal/state.Lock
      - code: internal/state.FileLock.Release
      - code: cmd/sitboard.stateFile
      - test: internal/state.TestWriteIsAtomic
      - test: internal/state.TestLockNamesNoOneWhenTheHolderCannotWrite
      - test: cmd/sitboard.TestNoStateWritesNothing

  - id: page-gets
    text: >-
      **No conversation text, file contents or tool results.** The page gets
      session names and titles, home-relative folder paths (including the folders you set to
      always or never group, up to 200, whether or not an agent works in
      them), repository names with their owner ("owner/name") or GitLab group
      path, agterm workspace names, pull request and merge request numbers,
      titles and links with their state, checks, review or approval and draft
      flag, the numbers and links of the issues they close in their own
      repository or project, the GitLab status line, the links and titles of
      the artifacts a session published, and, for Leftovers, the home-relative
      worktree and clone paths and branch names of merged work still on the
      machine, counts of held-back items by reason and when that list was
      made, each card's id (the tool's name and the session's own id, such as
      `claude:` and Claude Code's session id) and, with agterm, the agterm
      session id of its terminal, plus derived fields such as states, times,
      model ids and effort levels, token counts and the estimated cost at API
      list price, subagent counts, the versions of the tools it reads, and
      sitboard's own version, commit, operating system and architecture. It
      never serves the text of prompts and replies, the contents of files or
      whole tool results. The free text it does serve is in those names and
      titles, which hold whatever words they were given: a session's name, a
      pull or merge request's title, an artifact's title as the session's own
      publish reported it.
    short: >-
      **No conversation text, file contents or tool results.** The text of
      prompts and replies, the contents of files and whole tool results are
      never served. The page gets names (of sessions, of repositories with
      their owner or GitLab group, of agterm workspaces), titles (of sessions,
      pull and merge requests and artifacts), which hold whatever words they
      were given, home-relative folder paths, pull request, merge request,
      issue and artifact links, each card's id (the tool and the session's own
      id) and, with agterm, its terminal's session id, and derived fields such
      as states, checks, times, model ids, effort levels, token counts,
      estimated costs, counts and versions; for leftovers, the home-relative
      paths and branch names of merged work still on the machine.
    brief: >-
      The page gets names, titles, folder paths, states, pull and merge request
      titles and links, the links of the issues they close, and artifact titles
      and links, never the text of prompts and replies, file contents or whole
      tool results. A name or a title holds whatever words it was given: an
      artifact's title, for one, is what the session's publish reported.
    anchors:
      - value: internal/state.MaxGroupingSettings
        is: "200"
